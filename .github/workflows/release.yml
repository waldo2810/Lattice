name: Release

# Builds, signs, notarizes, staples and publishes Lattice when a `v*` tag is
# pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
#
# ---------------------------------------------------------------------------
# REQUIRED REPOSITORY SECRETS
# ---------------------------------------------------------------------------
# This workflow REFUSES TO RUN unless all of the following are configured
# under Settings -> Secrets and variables -> Actions. It fails fast and loudly
# rather than quietly publishing an unsigned build, because macOS ties
# Accessibility permission grants to the code signature: an unsigned or
# ad-hoc-signed Lattice loses the user's grant on every update.
#
#   MACOS_CERTIFICATE_P12
#       Base64 of a "Developer ID Application" certificate exported from
#       Keychain Access as a .p12 (private key included):
#           base64 -i DeveloperID.p12 | pbcopy
#
#   MACOS_CERTIFICATE_PASSWORD
#       The password chosen when exporting that .p12.
#
#   APPLE_TEAM_ID
#       The 10-character Apple Developer Team ID (e.g. ABCDE12345). Used for
#       the export options plist and for notarytool.
#
#   APPLE_API_KEY_ID
#       Key ID of an App Store Connect API key with the "Developer" role
#       (App Store Connect -> Users and Access -> Integrations -> Keys).
#
#   APPLE_API_ISSUER_ID
#       Issuer ID shown on the same App Store Connect Keys page.
#
#   APPLE_API_KEY_P8
#       Base64 of the downloaded AuthKey_<KEYID>.p8 private key:
#           base64 -i AuthKey_XXXXXXXX.p8 | pbcopy
#
# NOTE: all of the above require a PAID Apple Developer Program membership
# ($99/yr). As of writing that account has NOT been confirmed - see the open
# question in docs/user-stories/release-artifact-and-signing.md. Until it
# exists, tagging a release will fail at the "Verify signing secrets" step,
# which is the intended behaviour.
#
# Secret hygiene: secrets are only ever passed through environment variables
# into a single shell step, never echoed, and the signing certificate is
# imported into a throwaway keychain that is deleted in an `if: always()`
# step. `set -x` must never be enabled in the steps below.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build, sign, notarize and publish
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      SCHEME: Lattice
      APP_NAME: Lattice
      PROJECT: Lattice.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/Lattice.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      ARTIFACT_DIR: ${{ github.workspace }}/build/artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Newest non-beta Xcode on the image. See the longer note in ci.yml:
      # what matters is an Xcode new enough to compile the project's Swift and
      # SwiftUI, not one matching MACOSX_DEPLOYMENT_TARGET (14.0) - a newer
      # Xcode builds against an older deployment target normally. Keeping this
      # resilient rather than exact-pinned means an image rollout cannot break
      # a release. Notarization is unaffected by the Xcode version.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # AC 5: the tag must agree with MARKETING_VERSION in the project file,
      # so a release can never be cut from a project that was not version
      # bumped.
      - name: Verify tag matches MARKETING_VERSION
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MARKETING_VERSION="$(
            grep -m1 -E 'MARKETING_VERSION = ' "$PROJECT/project.pbxproj" \
              | sed -E 's/.*MARKETING_VERSION = ([^;]*);.*/\1/' \
              | tr -d ' "'
          )"
          echo "Tag version:       $TAG"
          echo "MARKETING_VERSION: $MARKETING_VERSION"
          if [ "$TAG" != "$MARKETING_VERSION" ]; then
            echo "::error::Tag v$TAG does not match MARKETING_VERSION $MARKETING_VERSION. Bump MARKETING_VERSION (and CURRENT_PROJECT_VERSION) or retag."
            exit 1
          fi

      # Fail fast, before any build work, if the signing material is missing.
      # Only emptiness is tested - values are never printed.
      - name: Verify signing secrets are present
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
                      APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
                      APPLE_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required signing secrets:$missing"
            echo "This workflow will not publish an unsigned build. See the comment block at the top of .github/workflows/release.yml for how to create each secret, and docs/user-stories/release-artifact-and-signing.md for why signing is mandatory."
            exit 1
          fi
          echo "All required signing secrets are present."

      # The certificate goes into a temporary, randomly-named keychain that
      # exists only for this job and is destroyed by the cleanup step below.
      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/lattice-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tail -n 1

      - name: Archive (Release, Developer ID, hardened runtime)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            archive

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"

          # Built with PlistBuddy rather than a heredoc: a YAML block scalar
          # would indent the XML declaration, which XML forbids.
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string developer-id" \
                                  -c "Add :teamID string $APPLE_TEAM_ID" \
                                  -c "Add :signingStyle string manual" \
                                  -c "Add :destination string export" \
                                  "$PLIST" > /dev/null

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$EXPORT_PATH"

      # Notarization is submitted synchronously (--wait). It usually completes
      # in a few minutes; the job timeout above allows for a slow notary day.
      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          APP_PATH="$EXPORT_PATH/$APP_NAME.app"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"

          # notarytool only accepts an archive, not a bare .app bundle.
          NOTARIZE_ZIP="$RUNNER_TEMP/$APP_NAME-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f "$KEY_PATH" "$NOTARIZE_ZIP"

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vvv -t exec "$APP_PATH"

      - name: Package artifact and checksum
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="$APP_NAME-$VERSION-macOS.zip"
          ditto -c -k --keepParent \
            "$EXPORT_PATH/$APP_NAME.app" \
            "$ARTIFACT_DIR/$ZIP_NAME"
          cd "$ARTIFACT_DIR"
          shasum -a 256 "$ZIP_NAME" > "$ZIP_NAME.sha256"
          cat "$ZIP_NAME.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$ARTIFACT_DIR"/*

      # Runs even when an earlier step failed, so signing material never
      # outlives the job.
      - name: Delete temporary keychain
        if: always()
        run: |
          set -euo pipefail
          security list-keychain -d user -s login.keychain-db || true
          KC="${KEYCHAIN_PATH:-$RUNNER_TEMP/lattice-signing.keychain-db}"
          if [ -f "$KC" ]; then
            security delete-keychain "$KC" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" || true
