name: CI

# Builds Lattice on every pull request and on pushes to main.
#
# The build is unsigned (CODE_SIGNING_ALLOWED=NO) on purpose: pull requests
# from forks cannot read repository secrets, and CI should still be able to
# verify that the code compiles. Signing happens only in release.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Release, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pin the toolchain rather than trusting the runner image default, so a
      # GitHub image rollout cannot silently change the compiler under us.
      # Must stay >= the Xcode required by MACOSX_DEPLOYMENT_TARGET in
      # Lattice.xcodeproj/project.pbxproj.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build Lattice (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lattice.xcodeproj \
            -scheme Lattice \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # TODO: add a test step here once a test target exists.
      # See docs/user-stories/test-target-and-coverage.md. Expected shape:
      #   xcodebuild -project Lattice.xcodeproj -scheme Lattice \
      #     -destination 'platform=macOS' test
